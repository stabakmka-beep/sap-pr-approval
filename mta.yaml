_schema-version: 3.3.0
ID: purchase-request
version: 1.0.0
description: Purchase request approval on SAP BTP, CAP Node.js and Fiori elements.
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --include=dev
        - npx cds build --production
        - node scripts/pack-html5.mjs
modules:
  - name: purchase-request-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      NODE_ENV: production
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: purchase-request-auth
      - name: purchase-request-db
      - name: purchase-request-destination
      - name: purchase-request-connectivity

  - name: purchase-request-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 256M
    requires:
      - name: purchase-request-db

  - name: purchase-request
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: purchase-request-auth
      - name: purchase-request-destination
      - name: purchase-request-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: purchase-request-html5-deployer
    type: com.sap.application.content
    path: gen/html5
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: purchase-request-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources

resources:
  - name: purchase-request-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: purchase-request-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
            - https://*.cfapps.*.hana.ondemand.com/**
            - https://*.applicationstudio.cloud.sap/**
    requires:
      - name: app-api

  - name: purchase-request-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  - name: purchase-request-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: ui5
                Description: SAPUI5 CDN used if you later route UI5 through the approuter
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication

  - name: purchase-request-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: purchase-request-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      config:
        sizeLimit: 2

  - name: purchase-request-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
